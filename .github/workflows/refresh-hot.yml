name: 全网热点刷新

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: pip install requests
        
      - name: 抓取热点
        run: python pipeline/fetch_hot.py
        
      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@hot"
          git add data/
          git diff --staged --quiet || git commit -m "hot: $(date +%H:%M)"
          git push
