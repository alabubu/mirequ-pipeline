name: 热点刷新

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pipeline/fetch_hot.py
      - run: sleep 300
      - run: |
          git config user.name bot && git config user.email bot@m.bot
          echo "$(date +%s)" > data/.ts && git add data/
          git commit -m "data" || true && git push
