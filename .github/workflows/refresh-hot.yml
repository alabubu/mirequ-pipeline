name: 热点刷新

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pipeline/fetch_hot.py
      - run: |
          git config user.name bot && git config user.email bot@m.bot
          echo "$(date +%s)" > data/.ts && git add data/
          git commit -m "data" || true
          for i in 1 2 3; do
            git pull --rebase origin main 2>/dev/null && git push && break
            sleep 3
          done
