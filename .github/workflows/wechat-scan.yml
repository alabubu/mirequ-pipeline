name: 公众号扫描

on:
  schedule:
    - cron: "0 0,2,4,6,8,10,12,14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: cd scanner && python dajiala_scanner.py
      - run: cd scanner && python export_wechat.py
      - run: |
          git config user.name bot && git config user.email bot@m.bot
          git add scanner/ data/wechat.json
          git commit -m "wechat-scan" || true && git push
